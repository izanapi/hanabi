<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111b20"><title>HANABI — 音の図譜</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#111b20;color:#d4d6c9;font-family:Georgia,'Times New Roman',serif}main{height:100%;height:100dvh;position:relative;max-width:1100px;margin:auto}canvas{width:100%;height:100%;display:block;touch-action:none}header{position:absolute;left:28px;top:calc(25px + env(safe-area-inset-top));pointer-events:none}h1{font-size:15px;letter-spacing:.38em;font-weight:400;margin:0 0 9px}small{font:9px monospace;letter-spacing:.2em;color:#788d91}#hint{position:absolute;top:47%;width:100%;text-align:center;pointer-events:none;transition:opacity 2s;color:#9fafa8;font-size:12px;letter-spacing:.22em;line-height:2.5}footer{position:absolute;bottom:calc(22px + env(safe-area-inset-bottom));left:28px;right:28px;display:flex;gap:20px;align-items:end;border-top:1px solid #344247;padding-top:18px}label{flex:1;font:9px monospace;letter-spacing:.16em;color:#9caea7}input{display:block;width:100%;margin:15px 0 0;accent-color:#b0bf89;height:14px}button{color:#b9c7b9;border:1px solid #44534f;background:#152126;padding:12px;font-size:11px;border-radius:50%;min-width:44px;min-height:44px}#caption{position:absolute;bottom:120px;left:28px;font-size:10px;letter-spacing:.2em;color:#718985;pointer-events:none}
</style><main><canvas aria-label="花火の演奏面。触れて、滑らせて、離す。キーボードではスペースで演奏。" tabindex="0"></canvas><header><h1>HANABI</h1><small>音の図譜 / 001</small></header><div id="hint">夜空に、指を置く。<br><small>触れる · 育てる · 離す</small></div><div id="caption">余白に、音が咲く。</div><footer><label> ECHO<input id="echo" aria-label="エコー" type="range" min="0" max="100" value="30"></label><label> HALL<input id="hall" aria-label="残響" type="range" min="0" max="100" value="30"></label><label> VOLUME<input id="volume" aria-label="音量" type="range" min="0" max="100" value="65"></label><button id="mute" aria-label="消音" aria-pressed="false">音</button></footer></main>
<script>
'use strict';
const canvas=document.querySelector('canvas'),g=canvas.getContext('2d'),hint=document.querySelector('#hint'),caption=document.querySelector('#caption');
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
let w,h,ac,bus,master,delay,echoGain,hallGain,muted=false,voices=0,last=0,elapsed=0;
const blooms=[],fingers=new Map(),events=[];
function resize(){const r=canvas.getBoundingClientRect();w=r.width;h=r.height;const d=Math.min(devicePixelRatio,2);canvas.width=w*d;canvas.height=h*d;g.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();
function audio(){if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();bus=ac.createGain();master=ac.createGain();const comp=ac.createDynamicsCompressor();comp.threshold.value=-20;comp.ratio.value=6;bus.connect(comp);comp.connect(master);master.connect(ac.destination);delay=ac.createDelay(2);delay.delayTime.value=.61;const feedback=ac.createGain();feedback.gain.value=.38;echoGain=ac.createGain();bus.connect(delay);delay.connect(feedback);feedback.connect(delay);delay.connect(echoGain);echoGain.connect(comp);const con=ac.createConvolver(),buf=ac.createBuffer(2,ac.sampleRate*4,ac.sampleRate);for(let c=0;c<2;c++){const d=buf.getChannelData(c);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3)}con.buffer=buf;hallGain=ac.createGain();bus.connect(con);con.connect(hallGain);hallGain.connect(comp);controls()}ac.resume().catch(()=>{hint.style.opacity=1;hint.textContent='もう一度触れて音を開始'});}
function controls(){if(!ac)return;const t=ac.currentTime;master.gain.setTargetAtTime(muted?0:document.querySelector('#volume').value/100*.7,t,.08);echoGain.gain.setTargetAtTime(document.querySelector('#echo').value/100*.8,t,.1);hallGain.gain.setTargetAtTime(document.querySelector('#hall').value/100*1.5,t,.1)}document.querySelectorAll('input').forEach(e=>e.oninput=controls);document.querySelector('#mute').onclick=function(){muted=!muted;this.textContent=muted?'静':'音';this.setAttribute('aria-pressed',muted);controls()};
const scale=[0,4,5,7,11];function pitch(n){return 440*2**((41+12*Math.floor(n/5)+scale[((n%5)+5)%5]-69)/12)}
function sound(n,kind,duration,pan,amp=.1){if(!ac||ac.state!=='running'||voices>64)return;voices++;const t=ac.currentTime,env=ac.createGain(),p=ac.createStereoPanner(),filter=ac.createBiquadFilter();p.pan.value=clamp(pan,-1,1);filter.type='lowpass';filter.frequency.value=kind===2?1600:5000;env.connect(filter);filter.connect(p);p.connect(bus);env.gain.setValueAtTime(.0001,t);env.gain.exponentialRampToValueAtTime(amp,t+(kind===0?.4:.018));env.gain.exponentialRampToValueAtTime(.0001,t+duration);const nodes=[];const f=pitch(n);for(const ratio of (kind===1?[1,2.003,3.98]:kind===2?[1,1.013,2.71]:[.5,1,2])){const o=ac.createOscillator(),level=ac.createGain();o.type=kind===2?'triangle':'sine';o.frequency.setValueAtTime(f*ratio,t);o.frequency.exponentialRampToValueAtTime(f*ratio*(kind===2?.82:1),t+duration);level.gain.value=.34/Math.sqrt(ratio);o.connect(level);level.connect(env);o.start(t);o.stop(t+duration+.1);nodes.push(o,level)}nodes[0].onended=()=>{nodes.forEach(n=>n.disconnect());env.disconnect();filter.disconnect();p.disconnect();voices--};}
function seed(x,y){const b={x,y,tx:x,ty:y,born:elapsed,open:null,charge:0,n:Math.floor(clamp(x/w,0,.99)*8),hue:rand(65,175),rays:[],lastTouch:-10,drift:0};for(let i=0;i<72;i++)b.rays.push({a:i/72*Math.PI*2,l:rand(.58,1),pulse:rand(0,6),spark:i%12===0});blooms.push(b);if(blooms.length>16)blooms.shift();sound(b.n-5,0,2.8,x/w*2-1,.095);return b}
function open(b){if(b.open!==null)return;b.open=elapsed;b.charge=Math.min(1,(elapsed-b.born)/3);const count=4+Math.floor(b.charge*5);for(let i=0;i<count;i++)events.push({time:elapsed+(i===0?0:rand(.3,5.8)),b,n:b.n+[0,2,4,5,7,9][i%6],kind:i%3});caption.textContent=['光がほどける。','遠くで、響きが重なる。','余韻の輪郭。'][Math.floor(rand(0,3))]}
function point(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
canvas.onpointerdown=e=>{e.preventDefault();audio();hint.style.opacity=0;canvas.setPointerCapture(e.pointerId);const p=point(e);fingers.set(e.pointerId,seed(p.x,p.y))};
canvas.onpointermove=e=>{const p=point(e),b=fingers.get(e.pointerId);if(b){b.tx=p.x;b.ty=p.y}for(const o of blooms){if(o.open===null)continue;const age=elapsed-o.open,rr=radius(o,age),d=Math.hypot(p.x-o.x,p.y-o.y);if(Math.abs(d-rr*.8)<28&&elapsed-o.lastTouch>.55){o.lastTouch=elapsed;sound(o.n+5+Math.floor(rand(0,4)),1,2,p.x/w*2-1,.065);o.drift+=.08}}};
function release(e){const b=fingers.get(e.pointerId);if(b)open(b);fingers.delete(e.pointerId)}canvas.onpointerup=release;canvas.onpointercancel=release;canvas.onlostpointercapture=release;
canvas.onkeydown=e=>{if(e.code==='Space'&&!e.repeat){e.preventDefault();audio();hint.style.opacity=0;fingers.set('key',seed(rand(w*.25,w*.75),rand(h*.3,h*.6)))}};canvas.onkeyup=e=>{if(e.code==='Space'){e.preventDefault();release({pointerId:'key'})}};
function clear(){fingers.clear();events.length=0;blooms.length=0;if(ac)ac.suspend()}document.addEventListener('visibilitychange',()=>{if(document.hidden)clear()});addEventListener('blur',()=>{for(const b of fingers.values())open(b);fingers.clear()});
function radius(b,a){return Math.min(w*.34,190)*(0.7+b.charge*.55)*(1-Math.exp(-a*1.7))}
function frame(ms){const dt=Math.min(.04,(ms-last)/1000||.016);last=ms;elapsed+=dt;g.fillStyle='#111b20';g.fillRect(0,0,w,h);g.fillStyle='#7d96901c';for(let i=0;i<65;i++){g.fillRect((i*137.7)%w,(i*93.3)%h,1,1)}
for(let i=events.length-1;i>=0;i--){const e=events[i];if(e.time<=elapsed){sound(e.n,e.kind,e.kind===0?5:rand(2,4),e.b.x/w*2-1,.085);e.b.lastTouch=elapsed;events.splice(i,1)}}
for(let j=blooms.length-1;j>=0;j--){const b=blooms[j];if(b.open===null){b.x+=(b.tx-b.x)*dt*4;b.y+=(b.ty-b.y)*dt*4;const age=elapsed-b.born;b.charge=Math.min(age/3,1);g.strokeStyle='#d8c37e66';g.lineWidth=.6;g.beginPath();g.arc(b.x,b.y,10+Math.min(age,4)*10,0,Math.PI*2);g.stroke();if(age>6)open(b)}const a=b.open===null?0:elapsed-b.open;if(a>10){blooms.splice(j,1);continue}const fade=b.open===null?1:Math.min(1,(10-a)/4),r=b.open===null?12+b.charge*28:radius(b,a);g.save();g.translate(b.x,b.y+a*a*.35);g.rotate(b.drift);g.globalAlpha=fade;for(const q of b.rays){const ca=Math.cos(q.a),sa=Math.sin(q.a),len=r*q.l;g.strokeStyle='#8ba3a522';g.lineWidth=.6;g.beginPath();g.moveTo(ca*r*.1,sa*r*.1);g.lineTo(ca*(r+18),sa*(r+18));g.stroke();const grad=g.createLinearGradient(0,0,ca*len,sa*len);grad.addColorStop(0,'#dcb661');grad.addColorStop(.45,'#c9c66a');grad.addColorStop(1,`hsla(${b.hue},48%,70%,${.35+.3*Math.sin(a*1.8+q.pulse)})`);g.strokeStyle=grad;g.lineWidth=1;g.beginPath();g.moveTo(ca*len*Math.min(.8,a*.08),sa*len*Math.min(.8,a*.08));g.lineTo(ca*len,sa*len);g.stroke();if(q.spark){g.fillStyle='#d5f4d5';g.fillRect(ca*len-1,sa*len-1,2,2)}}const glow=g.createRadialGradient(0,0,0,0,0,28);glow.addColorStop(0,'#eace8199');glow.addColorStop(1,'#eace8100');g.fillStyle=glow;g.fillRect(-28,-28,56,56);if(a>1){g.strokeStyle='#91a19844';g.beginPath();g.moveTo(r*.7,-r*.7);g.lineTo(r*.85,-r-8);g.lineTo(r+30,-r-8);g.stroke();g.fillStyle='#90a09a';g.font='7px monospace';g.fillText('H / '+String(j+1).padStart(2,'0'),r*.85,-r-12)}g.restore()}requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
